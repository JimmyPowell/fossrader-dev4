spring.application.name=fossrader-de4

# MongoDB配置
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=fossrader

# 服务器配置
server.port=8080
server.servlet.context-path=/

# 日志配置
logging.level.tech.cspioneer=DEBUG
# 开启MongoDB查询日志
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.mongodb.repository.query=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Jackson配置
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# Eureka客户端配置
eureka.client.service-url.defaultZone=http://admin:fossrader123@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# 如果版本兼容性检查失败，可以取消下面注释来禁用兼容性检查
# spring.cloud.compatibility-verifier.enabled=false

   # 在client的application.properties中添加
   eureka.instance.lease-renewal-interval-in-seconds=10
   eureka.instance.lease-expiration-duration-in-seconds=30
   